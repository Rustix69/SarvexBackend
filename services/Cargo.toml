[workspace]
resolver = "2"
members = [
  "crates/sarvex-contracts",
  "crates/sarvex-db",
  "crates/sarvex-domain",
  "crates/sarvex-events",
  "crates/sarvex-me-client",
  "crates/sarvex-auth",
  "crates/sarvex-runtime",
  "gw-rest",
  "gw-ws",
  "ledger-svc",
  "order-router",
  "risk-svc",
  "position-svc",
  "refdata-svc",
  "oracle-svc",
  "settlement-svc",
  "audit-svc",
  "admin-svc",
  "me-core-adapter",
  "marketdata-svc",
  "loadtest",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.38"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
jsonwebtoken = "9.3"
prost = "0.13"
prost-types = "0.13"
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
