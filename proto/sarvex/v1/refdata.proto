syntax = "proto3";

package sarvex.v1;

option go_package = "github.com/sarvex/proto/gen/go/sarvex/v1;sarvexv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "sarvex/v1/common.proto";

service RefData {
  rpc GetContract(GetContractRequest) returns (Contract);
  rpc ListContracts(ListContractsRequest) returns (ListContractsResponse);
  rpc ListSeries(ListSeriesRequest) returns (ListSeriesResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc TransitionState(TransitionStateRequest) returns (google.protobuf.Empty);
  rpc UpsertContract(UpsertContractRequest) returns (Contract);
  rpc GetEvent(GetEventRequest) returns (Event);
}

message Contract {
  string ticker = 1;
  string event_ticker = 2;
  string series_ticker = 3;
  ContractKind kind = 4;
  string question = 5;
  string underlying = 6;
  int64 tick_size = 7;
  int64 min_price_ticks = 8;
  int64 max_price_ticks = 9;
  int64 lower_bound_ticks = 10;
  int64 upper_bound_ticks = 11;
  int64 multiplier_micro_usdc = 12;
  int64 max_order_size = 13;
  int64 position_limit_per_user = 14;
  ContractState state = 15;
  google.protobuf.Timestamp listed_at = 16;
  google.protobuf.Timestamp open_at = 17;
  google.protobuf.Timestamp close_at = 18;
  google.protobuf.Timestamp expected_resolution_at = 19;
  string settlement_source = 20;
  string oracle_policy = 21;
  google.protobuf.Struct settlement_rule = 22;
  uint64 close_global_seq = 23;
  // Raw ticks per display unit. Display-only; never use this as a cash scale.
  int64 divider = 24;
  // Contract multiplier in micro-USDC per one display unit of the underlying.
  int64 multiplier_micro_per_display_unit = 25;
  // Derived listing-time value in micro-USDC per raw price tick.
  int64 tick_value_micro = 26;
  // Binary YES condition on the event outcome axis (cross margin, Stage 1):
  // {"type":"range","lo":341,"hi":null} or {"type":"categories","yes_values":[...]}.
  // Empty for futures, whose band defines the payoff.
  google.protobuf.Struct payoff_rule = 27;
  // Settlement value of a winning binary in price ticks (100 = 1 USDC).
  int64 payout_ticks = 28;
}

message Event {
  string event_ticker = 1;
  string series_ticker = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp expected_resolution_at = 5;
  // ISOLATED (per-contract locks) or PORTFOLIO (cross margin per event).
  string margin_model = 6;
  // NUMERIC or CATEGORICAL outcome axis.
  string outcome_kind = 7;
  // Kill switch (CM-04): new orders rejected with EVENT_HALTED; cancels, matched
  // fills and settlement continue on the event's margin path.
  bool trading_halted = 8;
  // Raw outcome ticks per display unit (CM-06); 0 when not set.
  int64 outcome_divider = 9;
  // Contractual outcome grid (CM-11): { outcome_anchor + n * outcome_step }
  // within [outcome_min, outcome_max] when those are present.
  int64 outcome_step = 10;
  int64 outcome_anchor = 11;
  optional int64 outcome_min = 12;
  optional int64 outcome_max = 13;
}

message Series {
  string series_ticker = 1;
  string title = 2;
  string description = 3;
}

message GetContractRequest {
  string ticker = 1;
}

message ListContractsRequest {
  ContractState state = 1;
  string series_ticker = 2;
  int32 limit = 3;
  string cursor = 4;
  ContractKind kind = 5;
  string event_ticker = 6;
  string underlying = 7;
  string category = 8;
  google.protobuf.Timestamp expected_resolution_from = 9;
  google.protobuf.Timestamp expected_resolution_to = 10;
}

message ListContractsResponse {
  repeated Contract contracts = 1;
  string next_cursor = 2;
}

message ListSeriesRequest {
  int32 limit = 1;
  string cursor = 2;
}

message ListSeriesResponse {
  repeated Series series = 1;
  string next_cursor = 2;
}

message ListEventsRequest {
  string series_ticker = 1;
  google.protobuf.Timestamp expected_resolution_from = 2;
  google.protobuf.Timestamp expected_resolution_to = 3;
  int32 limit = 4;
  string cursor = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  string next_cursor = 2;
}

message TransitionStateRequest {
  string ticker = 1;
  ContractState new_state = 2;
  string reason = 3;
}

message UpsertContractRequest {
  Contract contract = 1;
}

message GetEventRequest {
  string event_ticker = 1;
}
